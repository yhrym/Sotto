name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate version
        run: |
          set -euo pipefail
          version="$(awk '
            /MARKETING_VERSION =/ {
              gsub(/;/, "", $3)
              print $3
              exit
            }
          ' Sotto.xcodeproj/project.pbxproj)"
          if [[ -z "$version" ]]; then
            echo "Could not read MARKETING_VERSION."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version."
            exit 1
          fi

      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Sotto.xcodeproj \
            -scheme Sotto \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SottoReleaseTestDerivedData" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES

      - name: Build Universal app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Sotto.xcodeproj \
            -scheme Sotto \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SottoReleaseDerivedData" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            ONLY_ACTIVE_ARCH=NO \
            'ARCHS=arm64 x86_64'

      - name: Verify app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/SottoReleaseDerivedData/Build/Products/Release/Sotto.app"
          entitlements="$RUNNER_TEMP/Sotto.entitlements.txt"

          codesign --verify --deep --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/Sotto" -verify_arch arm64 x86_64
          codesign -d --xml --entitlements - "$app" > "$entitlements"

          expected_entitlements="$(
            printf '%s\n' \
              'com.apple.security.app-sandbox=true' \
              'com.apple.security.assets.music.read-write=true' \
              'com.apple.security.device.audio-input=true' \
              'com.apple.security.files.bookmarks.app-scope=true' \
              'com.apple.security.files.user-selected.read-write=true' |
              sort
          )"
          actual_entitlements="$(
            plutil -p "$entitlements" |
              sed -nE 's/^  "([^"]+)" => (true|false)$/\1=\2/p' |
              sort
          )"

          if [[ "$actual_entitlements" != "$expected_entitlements" ]]; then
            echo "Unexpected entitlement set."
            echo "Expected:"
            echo "$expected_entitlements"
            echo "Actual:"
            echo "$actual_entitlements"
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/SottoReleaseDerivedData/Build/Products/Release/Sotto.app"

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/Sotto-local.zip
          (
            cd dist
            shasum -a 256 Sotto-local.zip > Sotto-local.zip.sha256
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/Sotto-local.zip \
            dist/Sotto-local.zip.sha256 \
            --verify-tag \
            --title "Sotto ${GITHUB_REF_NAME#v}" \
            --generate-notes
