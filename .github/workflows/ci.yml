name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Sotto.xcodeproj \
            -scheme Sotto \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SottoDerivedData" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES
